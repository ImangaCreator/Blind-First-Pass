async function hashPw(pw, salt) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

/* =========================================================

const HEADERS = new Set(["SUMMARY","EDUCATION","EXPERIENCE","SKILLS","OBJECTIVE","PROFILE","CONTACT","ACTIVITIES","PROJECTS","RESUME","CURRICULUM","VITAE","PROFESSIONAL","WORK","HISTORY","CERTIFICATIONS","LEADERSHIP","INTERESTS"]);
const NAME_RE = /^[\p{Lu}][\p{L}'’.-]*(?:[ \t]+[\p{Lu}][\p{L}'’.-]*){1,3}$/u;
function detectName(text) {
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 4);
  for (const line of lines) {
    const cand = line.split(/[|•·,]/)[0].trim();
    if (!NAME_RE.test(cand)) continue;
    if (cand.split(/[ \t]+/).some(w => HEADERS.has(w.toUpperCase().replace(/[^A-Z]/g, "")))) continue;
    return cand;
  }
  return null;

const PATTERNS = [
  ["email", /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g],
  ["link", /\b(?:https?:\/\/)?(?:www\.)?(?:linkedin\.com|github\.com|behance\.net|[\w-]+\.(?:com|io|dev|me|net|org|co))\/[^\s|,;]*/gi],
  ["link", /\bhttps?:\/\/[^\s|,;]+/gi],
  ["phone", /(?:\+?1[ .-]?)?\(?\b\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}\b/g],
  ["address", /\b\d{1,5}[ \t]+(?:[\p{L}0-9.'-]+[ \t]+){0,4}(?:St|Street|Ave|Avenue|Blvd|Boulevard|Rd|Road|Pl|Place|Ln|Lane|Dr|Drive|Pkwy|Parkway|Ct|Court|Ter|Terrace|Way)\b\.?(?:,?[ \t]*(?:Apt|Unit|#)[ \t]*[\w-]+)?/giu],
  ["location", /\b\p{Lu}[\p{L}.]*(?:[ \t]+\p{Lu}[\p{L}.]*){0,2},[ \t]*(?:NY|NJ|CT|PA|New York)(?:[ \t]+\d{5}(?:-\d{4})?)?\b/gu],
  ["location", /\b(?:NY|NJ|CT|PA)[ \t]+\d{5}(?:-\d{4})?\b/g],
  ["pronouns", /\b(?:she\/her|he\/him|they\/them)(?:\/\w+)?\b/gi]
];
function redact(text) {
  const ranges = [];
  const name = detectName(text);
  if (name) {
    const parts = [name, ...name.split(/[ \t]+/).map(w => w.replace(/[.,]/g, "")).filter(w => w.length >= 2)];
    for (const p of parts) {
      const re = new RegExp("(?<![\\p{L}])" + reEsc(p) + "(?![\\p{L}])", "giu");
      let m; while ((m = re.exec(text))) ranges.push({ s: m.index, e: m.index + m[0].length, t: "name" });
    }
  }
  const found = {};
  for (const [type, re] of PATTERNS) {
    re.lastIndex = 0;
    let m; while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      ranges.push({ s: m.index, e: m.index + m[0].length, t: type });
      if (!found[type]) found[type] = m[0];
    }
  }
  ranges.sort((a, b) => a.s - b.s || b.e - a.e);
  const merged = [];
  for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r.s < l.e) { if (r.e > l.e) l.e = r.e; } else merged.push({ ...r }); }
  let html = "", plain = "", pos = 0;
  for (const r of merged) {
    html += esc(text.slice(pos, r.s)) + `<span class="redact ${r.t}">${r.t} hidden</span>`;
    plain += text.slice(pos, r.s) + `[${r.t} hidden]`;
    pos = r.e;
  }
  html += esc(text.slice(pos)); plain += text.slice(pos);
  return { html, plain, name, email: found.email || "", phone: found.phone || "" };
}
function toSheet(html) {
  let first = true;
  return html.split(/\r?\n/).map(l => {
    const t = l.replace(/<[^>]+>/g, "").trim();
    const isHead = t && !l.includes("redact") && t.length <= 32 && t === t.toUpperCase() && /[A-Z]{3}/.test(t);
    const cls = "ln" + (isHead ? " h" + (first ? " first" : "") : "");
    if (t) first = false;
    return `<div class="${cls}">${l || "&nbsp;"}</div>`;
  }).join("");
}

function users() { return store.get("bfp.users", []); }
function session() { return store.get("bfp.session", null); }
function me() { const s = session(); return s ? users().find(u => u.id === s.userId) || null : null; }
function dkey() { return "bfp.data." + me().orgId; }
function vkey() { return "bfp.vault." + me().orgId; }
function data() { return store.get(dkey(), { jobs: [], log: [], retention: 12, seq: 1000 }); }
function save(d) { store.set(dkey(), d); }
function vault() { return store.get(vkey(), {}); }
function saveVault(v) { store.set(vkey(), v); }
function log(d, action, record) { d.log.unshift({ t: Date.now(), who: me().name, action, record: record || "" }); }
function nextCode(d) { d.seq += Math.floor(Math.random() * 37) + 11; return "A-" + d.seq; }

function makeCandidate(d, v, text, receivedAt, prepared) {
  const r = redact(text);
  const code = nextCode(d);
  v[code] = { name: r.name || "(name not detected)", email: r.email, phone: r.phone };
  return { code, receivedAt, html: toSheet(r.html), plain: r.plain, nameFound: !!r.name, status: "new", reason: "", checks: {},
    summary: prepared ? { sentence: prepared.sentence, points: prepared.points, source: "prepared", at: Date.now() } : null };
}
function seedSampleJob(d, v) {
  const job = { id: uid(), title: "Operations Associate", location: "Red Hook, Brooklyn (on site)", payMin: 22, payMax: 25, sample: true, createdAt: Date.now(), locked: false,
    requirements: ["Uses spreadsheets (Excel or Google Sheets) at work", "Has coordinated schedules, shipments or inventory", "Has worked with customers, patients or a team"], candidates: [] };
  const order = SAMPLE.map((_, i) => i).sort(() => Math.random() - .5);
  const base = Date.now() - 9 * 864e5;
  order.forEach((i, n) => job.candidates.push(makeCandidate(d, v, SAMPLE[i].text, base + n * 864e5 * 1.1 + i * 3.6e6, SAMPLE[i].summary)));

}

/* =========================================================
   Claude summaries (sample capability)
   ========================================================= */
let samplePromise = null;
function getSample() { if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null); return samplePromise; }
let sampleState = "unknown"; /* unknown | ready | none */
getSample().then(s => { sampleState = s ? "ready" : "none"; if (currentRoute().startsWith("job-")) render(); });
const JUDGMENT = /\b(strong|stronger|strongest|weak|weaker|fit|fits|ideal|excellent|impressive|recommend\w*|qualified|unqualified|overqualified|best|top|great|good|poor|promising|standout|stellar|solid|outstanding|perfect|exceptional|suitable|unsuitable|candidate for)\b/i;
const norm = s => s.replace(/\s+/g, " ").trim().toLowerCase();
async function summarize(jobId, code) {
  const d = data(); const job = d.jobs.find(j => j.id === jobId); const c = job && job.candidates.find(x => x.code === code);
  if (!c) return;
  const sample = await getSample();
  if (!sample) { toast("Summaries need the Claude connection, which this view doesn't have."); return; }
  ui.summarizing[code] = true; render();
  const prompt = `You write neutral, factual summaries of resumes for a blind first-pass screening tool. A human recruiter makes every decision.

Rules:
- Describe what the resume states. Do not evaluate, rank, compare, or judge fit for any job.
- Never use words such as strong, weak, fit, ideal, qualified, impressive, recommend, good, great, best, promising.
- Do not mention or infer name, gender, race, ethnicity, age, nationality, religion, disability, or family status.
- Leave out clubs, affiliations, associations, languages spoken, and locations.
- Each point's "quote" must be copied exactly, character for character, from the resume text below.
- Text in square brackets like [name hidden] was removed on purpose. Do not guess it.

Reply with only JSON in this shape:
{"sentence": "One plain sentence, under 30 words, describing education and work history.", "points": [{"label": "Education" | "Experience" | "Skills listed" | "Certifications", "quote": "exact text from the resume"}]}
Give 3 to 5 points.

Resume text:
"""
${c.plain.slice(0, 6000)}
"""`;
  try {
    const out = await sample.json(prompt, { modelTier: "default", cache: false });
    const hay = norm(c.plain);
    const allowed = new Set(["Education", "Experience", "Skills listed", "Certifications"]);
    let points = Array.isArray(out && out.points) ? out.points : [];
    /* Keep a point only if it is a verbatim quote from the redacted resume. */
    points = points.filter(p => p && allowed.has(p.label) && typeof p.quote === "string" && p.quote.trim().length > 3 && hay.includes(norm(p.quote)))
      .slice(0, 5).map(p => [p.label, p.quote.trim()]);
    let sentence = typeof (out && out.sentence) === "string" ? out.sentence.trim() : "";
    const dropped = (Array.isArray(out && out.points) ? out.points.length : 0) - points.length;
    let note = "";
    if (sentence && JUDGMENT.test(sentence)) { sentence = ""; note = "The summary sentence used evaluative language and was removed. "; }
    if (dropped > 0) note += dropped + " point" + (dropped === 1 ? "" : "s") + " did not match the resume word for word and " + (dropped === 1 ? "was" : "were") + " removed.";
    if (!sentence && !points.length) throw { code: "empty_after_checks" };
    const d2 = data(); const c2 = d2.jobs.find(j => j.id === jobId).candidates.find(x => x.code === code);
    c2.summary = { sentence, points, source: "claude", at: Date.now(), note: note.trim() };
    log(d2, "Generated summary with Claude", code); save(d2);
  } catch (e) {
    const msg = { not_granted: "Claude access wasn't allowed for this page. Summaries stay off.", sampling_disabled: "Claude isn't available for this account.", rate_limited: "Too many requests right now. Try again in a minute.", invalid_json: "The summary came back in the wrong format. Try again.", empty_after_checks: "Nothing in the summary could be matched to the resume, so it was discarded. Try again." }[e && e.code] || "The summary didn't finish. Try again.";
    toast(msg);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sampleState = "none";
  } finally { delete ui.summarizing[code]; render(); }
}

const root = document.getElementById("root");

function render() {
  const r = currentRoute();
  const protectedRoute = r === "jobs" || r === "activity" || r.startsWith("job-");
  if (protectedRoute && !me()) { toast("Sign in to open the dashboard."); location.replace("#signin"); return; }
  if ((r === "signin" || r === "signup") && me()) { location.replace("#jobs"); return; }
  if (r === "signup") root.innerHTML = viewAuth("signup");
  else if (r === "signin") root.innerHTML = viewAuth("signin");
  else if (r === "jobs") root.innerHTML = shell("jobs", viewJobs());
  else if (r === "activity") root.innerHTML = shell("activity", viewActivity());

  else root.innerHTML = viewHome();
}

async function handleAuth(mode, form) {
  const val = n => (form.elements[n] ? form.elements[n].value.trim() : "");
  const e = {};
  const email = val("email").toLowerCase(), pw = form.elements.password.value;
  if (mode === "signup") {
    if (!val("name")) e.name = "Enter your name.";
    if (!val("company")) e.company = "Enter your company.";
  }
  if (!email) e.email = "Enter your work email.";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = "Enter an email like name@company.com.";
  if (!pw) e.password = "Enter a password.";
  else if (mode === "signup" && pw.length < 8) e.password = "Use at least 8 characters.";
  const list = users();
  if (!Object.keys(e).length && mode === "signup" && list.some(u => u.email === email)) e.email = "An account with this email already exists. Sign in instead.";
  if (Object.keys(e).length) { ui.errors = e; render(); const first = document.querySelector(".invalid input"); if (first) first.focus(); return; }
  if (mode === "signup") {
    const salt = uid();
    const u = { id: uid(), orgId: uid(), name: val("name"), company: val("company"), email, role: form.elements.role.value, salt, pw: await hashPw(pw, salt), createdAt: Date.now() };
    list.push(u); store.set("bfp.users", list); store.set("bfp.session", { userId: u.id, at: Date.now() });
    const d = { jobs: [], log: [], retention: 12, seq: 1000 }; const v = {};
    store.set("bfp.data." + u.orgId, d);
    log(d, "Created account", u.company); seedSampleJob(d, v); save(d); saveVault(v);
    ui.errors = {}; toast("Account created. A sample job is ready to review."); go("jobs");
  } else {
    const u = list.find(x => x.email === email);
    const ok = u && (await hashPw(pw, u.salt)) === u.pw;
    if (!ok) { ui.errors = { form: "That email and password don't match an account in this browser." }; render(); return; }
    store.set("bfp.session", { userId: u.id, at: Date.now() });
    const d = data(); log(d, "Signed in"); save(d);
    ui.errors = {}; go("jobs");
  }
}

/* =========================================================
   Actions
   ========================================================= */
function jobFromRoute() { const r = currentRoute(); return r.startsWith("job-") ? r.slice(4) : null; }
function mutateCandidate(fn) {
  const id = jobFromRoute(); const d = data(); const job = d.jobs.find(j => j.id === id); if (!job) return;
  const c = job.candidates.find(x => x.code === ui.sel[id]); if (!c) return;
  fn(d, job, c); save(d); render();
}
function decide(status) {
  mutateCandidate((d, job, c) => {
    if (job.locked || c.status === status) return;
    c.status = status; c.reason = "";
    log(d, status === "advanced" ? "Advanced" : "Passed", c.code);
  });
}
function nextUndecided() {
  const id = jobFromRoute(); const d = data(); const job = d.jobs.find(j => j.id === id); if (!job) return;
  const list = visibleCandidates(job); const i = list.findIndex(x => x.code === ui.sel[id]);
  const rest = [...list.slice(i + 1), ...list.slice(0, Math.max(i, 0))];
  let n = rest.find(x => x.status === "new" || x.status === "review");
  if (!n) n = job.candidates.find(x => x.status === "new" || x.status === "review");
  if (!n) { toast(job.locked ? "This stage is locked." : "Every applicant has a decision. Lock the stage to reveal names."); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (!list.includes(n)) { ui.search = ""; ui.status = "all"; }
  selectCandidate(n.code);
}
function selectCandidate(code) {
  const id = jobFromRoute(); ui.sel[id] = code; ui.delStep = null;
  const d = data(); const job = d.jobs.find(j => j.id === id); const c = job && job.candidates.find(x => x.code === code);
  if (c && c.status === "new" && !job.locked) { c.status = "review"; log(d, "Opened for review", code); save(d); }
  render();
  const det = document.querySelector(".detail"); if (det && window.matchMedia("(max-width: 860px)").matches) det.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function readFile(file) {
  const name = file.name.toLowerCase();
  if (file.size > 5 * 1024 * 1024) throw new Error("File is over 5 MB.");
  if (name.endsWith(".txt") || file.type === "text/plain") return await file.text();
  if (name.endsWith(".docx")) {
    if (!window.mammoth) throw new Error("Word reader didn't load. Try a PDF.");
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value.split(/\n+/).map(s => s.trim()).filter(Boolean).join("\n");
  }
  if (name.endsWith(".pdf") || file.type === "application/pdf") {
    if (!window.pdfjsLib) throw new Error("PDF reader didn't load. Try a text file.");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const c = await (await pdf.getPage(p)).getTextContent();
      let line = "", lastY = null;
      for (const it of c.items) { const y = Math.round(it.transform[5]); if (lastY !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ""; } line += it.str; lastY = y; }
      out.push(line);
    }
    return out.map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n");
  }
  throw new Error("Unsupported file type. Use PDF, Word (.docx) or text.");
}
async function handleUpload(files) {
  const id = jobFromRoute();
  for (const file of files) {
    const row = { job: id, name: file.name, state: "reading" }; ui.uploads.unshift(row); render();
    try {
      const text = (await readFile(file)).trim();
      if (text.length < 40) throw new Error("No readable text found. Scanned PDFs can't be read yet.");
      const d = data(); const v = vault(); const job = d.jobs.find(j => j.id === id);
      const c = makeCandidate(d, v, text, Date.now(), null);
      job.candidates.push(c); log(d, "Uploaded and redacted resume", c.code); save(d); saveVault(v);
      row.state = "done"; row.code = c.code; ui.sel[id] = c.code;
    } catch (err) { row.state = "error"; row.msg = err.message || "Couldn't read this file."; }
    render();
  }
  setTimeout(() => { ui.uploads = ui.uploads.filter(x => x.state === "error" || x.job !== id); if (jobFromRoute() === id) render(); }, 6000);
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; const id = jobFromRoute();
  if (act === "check" || act === "reason") return;
  if (act === "signout") { const d = data(); log(d, "Signed out"); save(d); store.del("bfp.session"); ui.sel = {}; toast("Signed out."); go("home"); }
  else if (act === "newjob") { ui.newJob = true; ui.errors = {}; render(); const t = document.getElementById("title"); if (t) t.focus(); }
  else if (act === "newjob-cancel") { ui.newJob = false; ui.errors = {}; render(); }
  else if (act === "open-job") go("job-" + el.dataset.id);
  else if (act === "select") selectCandidate(el.dataset.code);
  else if (act === "decide") decide(el.dataset.d);
  else if (act === "next") nextUndecided();
  else if (act === "summarize") summarize(id, ui.sel[id]);
  else if (act === "clear-filters") { ui.search = ""; ui.status = "all"; render(); }
  else if (act === "lock") { ui.lockStep = true; render(); }
  else if (act === "lock-cancel") { ui.lockStep = false; render(); }
  else if (act === "lock-confirm") {
    const d = data(); const job = d.jobs.find(j => j.id === id);
    if (me().role !== "admin" || job.candidates.some(x => x.status === "new" || x.status === "review")) { ui.lockStep = false; render(); return; }
    job.locked = true; job.lockedAt = Date.now(); ui.lockStep = false;
    log(d, "Locked decisions", job.title);
    job.candidates.filter(x => x.status === "advanced").forEach(x => log(d, "Revealed identity", x.code));
    save(d); render(); toast("Decisions locked. Names revealed for advanced applicants.");
  }
  else if (act === "copy") {
    const ta = document.getElementById("copyOut");
    const done = () => { const d = data(); const job = d.jobs.find(j => j.id === id); log(d, "Exported contact list", job.title); save(d); toast("Contact list copied."); };
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("Press Ctrl+C or Cmd+C to copy."); }); } catch (err) { ta.select(); toast("Press Ctrl+C or Cmd+C to copy."); }
  }
  else if (act === "del") { ui.delStep = ui.sel[id]; render(); }
  else if (act === "del-cancel") { ui.delStep = null; render(); }
  else if (act === "del-confirm") {
    const d = data(); const v = vault(); const job = d.jobs.find(j => j.id === id); const code = ui.delStep;
    job.candidates = job.candidates.filter(x => x.code !== code); delete v[code];
    log(d, "Deleted applicant and identity record", code); save(d); saveVault(v); ui.delStep = null; toast(code + " deleted."); render();
  }
  else if (act === "wipe") { ui.wipeStep = true; render(); }
  else if (act === "wipe-cancel") { ui.wipeStep = false; render(); }
  else if (act === "wipe-confirm") {
    const d = data(); const n = d.jobs.reduce((s, j) => s + j.candidates.length, 0);
    d.jobs.forEach(j => j.candidates = []); saveVault({}); log(d, "Deleted all applicant data", n + " records"); save(d); ui.wipeStep = false; toast("All applicant data deleted."); render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { const tr = e.target.closest && e.target.closest("tr[data-act='open-job']"); if (tr) { go("job-" + tr.dataset.id); return; } }
  if (!jobFromRoute() || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "a" || e.key === "A") decide("advanced");
  if (e.key === "p" || e.key === "P") decide("passed");
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "check") mutateCandidate((d, job, c) => { c.checks[t.dataset.i] = t.checked; log(d, (t.checked ? "Marked" : "Unmarked") + " requirement: " + job.requirements[t.dataset.i], c.code); });
  else if (t.dataset && t.dataset.act === "reason") mutateCandidate((d, job, c) => { c.reason = t.value; log(d, "Recorded reason: " + (t.value || "none"), c.code); });
  else if (t.id === "st") { ui.status = t.value; render(); }
  else if (t.id === "so") { ui.sort = t.value; render(); }
  else if (t.id === "fileIn") { handleUpload(Array.from(t.files)); }
  else if (t.id === "ret") { const d = data(); d.retention = Number(t.value); log(d, "Set retention to " + t.value + " months"); save(d); toast("Retention set to " + t.value + " months."); render(); }
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  ui.search = e.target.value; clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 180);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "signupForm") handleAuth("signup", f);
  else if (f.id === "signinForm") handleAuth("signin", f);
  else if (f.id === "jobForm") {
    const g = n => f.elements[n].value.trim();
    const errs = {}; const min = Number(g("payMin")), max = Number(g("payMax"));
    if (!g("title")) errs.title = "Enter a job title.";
    if (!g("payMin") || !g("payMax") || min <= 0 || max < min) errs.pay = "Enter a pay range where the top is at least the bottom.";
    const reqs = g("reqs").split("\n").map(s => s.trim()).filter(Boolean);
    if (!reqs.length) errs.reqs = "Add at least one requirement.";
    if (Object.keys(errs).length) { const keep = { title: g("title"), location: g("location"), payMin: g("payMin"), payMax: g("payMax"), reqs: g("reqs") }; ui.errors = errs; render(); Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; }); return; }
    const d = data(); const job = { id: uid(), title: g("title"), location: g("location"), payMin: min, payMax: max, requirements: reqs.slice(0, 8), createdAt: Date.now(), locked: false, candidates: [] };
    d.jobs.unshift(job); log(d, "Created job", job.title); save(d); ui.newJob = false; ui.errors = {}; go("job-" + job.id);
  }
});
lastRoute = currentRoute();
render();
